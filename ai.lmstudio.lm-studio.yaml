app-id: ai.lmstudio.lm-studio
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: lmstudio
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --persist=.lmstudio
  - --talk-name=org.kde.StatusNotifierWatcher
separate-locales: false

modules:
  - name: squishy
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/squishy/cargo
        CARGO_NET_OFFLINE: ture
    build-commands:
      - cargo --offline --frozen build --release
      - install -Dpm755 -t ${FLATPAK_DEST}/bin target/release/squishy
    sources:
      - type: git
        url: https://github.com/pkgforge/squishy.git
        tag: v0.5.2
        commit: be34f0fe914747c2495aa36b1e609e9c18cc961a
      - generated-sources.json
  - name: lmstudio
    buildsystem: simple
    build-commands:
      - install -Dm755 -t ${FLATPAK_DEST}/bin/ apply_extra lmstudio
      - install -Dm644 -t ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps ${FLATPAK_ID}.png
      - install -Dm644 -t ${FLATPAK_DEST}/share/applications ${FLATPAK_ID}.desktop
      - install -Dm644 -t ${FLATPAK_DEST}/share/metainfo ${FLATPAK_ID}.metainfo.xml
    sources:
      - type: script
        commands:
          - exec zypak-wrapper /app/extra/lmstudio/lm-studio "$@"
        dest-filename: lmstudio
      - type: script
        commands:
          - squishy unsquashfs lmstudio.AppImage -w lmstudio >/dev/null
          - rm -f lmstudio.AppImage
        dest-filename: apply_extra
      - type: extra-data
        only-arches: [x86_64]
        filename: lmstudio.AppImage
        url: https://installers.lmstudio.ai/linux/x64/0.4.25-1/LM-Studio-0.4.25-1-x64.AppImage
        sha256: eca467446c833824697e8befab300fe5269fdf984e3ee4385fcbad8502f07c53
        size: 1012171087
        x-checker-data:
          type: rotating-url
          url: https://lmstudio.ai/download/latest/linux/x64?format=AppImage
          pattern: https://installers.lmstudio.ai/linux/x64/([0-9.]+)/LM-Studio-([0-9.]+)-x64.AppImage
      - type: extra-data
        only-arches: [aarch64]
        filename: lmstudio.AppImage
        url: https://installers.lmstudio.ai/linux/arm64/0.4.25-1/LM-Studio-0.4.25-1-arm64.AppImage
        sha256: e3ef32a37656e7e4e5cdadf52e72fa929d5f26eb6007be1666c76e4fdba8e084
        size: 1288885258
        x-checker-data:
          type: rotating-url
          url: https://lmstudio.ai/download/latest/linux/arm64?format=AppImage
          pattern: https://installers.lmstudio.ai/linux/arm64/([0-9.]+)/LM-Studio-([0-9.]+)-arm64.AppImage
      - type: file
        path: ai.lmstudio.lm-studio.desktop
      - type: file
        path: ai.lmstudio.lm-studio.metainfo.xml
      - type: file
        path: ai.lmstudio.lm-studio.png
