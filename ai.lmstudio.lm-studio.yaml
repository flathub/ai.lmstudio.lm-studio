app-id: ai.lmstudio.lm-studio
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: lmstudio
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --persist=.lmstudio
  - --talk-name=org.kde.StatusNotifierWatcher
separate-locales: false

modules:
  - name: squishy
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/squishy/cargo
        CARGO_NET_OFFLINE: ture
    build-commands:
      - cargo --offline --frozen build --release
      - install -Dpm755 -t ${FLATPAK_DEST}/bin target/release/squishy
    sources:
      - type: git
        url: https://github.com/pkgforge/squishy.git
        tag: v0.5.2
        commit: be34f0fe914747c2495aa36b1e609e9c18cc961a
      - generated-sources.json
  - name: lmstudio
    buildsystem: simple
    build-commands:
      - install -Dm755 -t ${FLATPAK_DEST}/bin/ apply_extra lmstudio
      - install -Dm644 -t ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps ${FLATPAK_ID}.png
      - install -Dm644 -t ${FLATPAK_DEST}/share/applications ${FLATPAK_ID}.desktop
      - install -Dm644 -t ${FLATPAK_DEST}/share/metainfo ${FLATPAK_ID}.metainfo.xml
    sources:
      - type: script
        commands:
          - exec zypak-wrapper /app/extra/lmstudio/lm-studio "$@"
        dest-filename: lmstudio
      - type: script
        commands:
          - squishy unsquashfs lmstudio.AppImage -w lmstudio >/dev/null
          - rm -f lmstudio.AppImage
        dest-filename: apply_extra
      - type: extra-data
        only-arches: [x86_64]
        filename: lmstudio.AppImage
        url: https://installers.lmstudio.ai/linux/x64/0.4.29-2/LM-Studio-0.4.29-2-x64.AppImage
        sha256: 55c841359589e58d75e5e1a210b9006053db4c5cef8a721934b24ecc674f5fe2
        size: 1092623621
        x-checker-data:
          type: rotating-url
          url: https://lmstudio.ai/download/latest/linux/x64?format=AppImage
          pattern: ^https://installers\.lmstudio\.ai/linux/x64/[^/]+/LM-Studio-([0-9.]+(?:-[0-9]+)?)-x64\.AppImage$
      - type: extra-data
        only-arches: [aarch64]
        filename: lmstudio.AppImage
        url: https://installers.lmstudio.ai/linux/arm64/0.4.29-2/LM-Studio-0.4.29-2-arm64.AppImage
        sha256: 6761d124e7b5446018c7608135f8f58a5462a1714c46ba1267e67828a33c0e94
        size: 1347841875
        x-checker-data:
          type: rotating-url
          url: https://lmstudio.ai/download/latest/linux/arm64?format=AppImage
          pattern: ^https://installers\.lmstudio\.ai/linux/arm64/[^/]+/LM-Studio-([0-9.]+(?:-[0-9]+)?)-arm64\.AppImage$
      - type: file
        path: ai.lmstudio.lm-studio.desktop
      - type: file
        path: ai.lmstudio.lm-studio.metainfo.xml
      - type: file
        path: ai.lmstudio.lm-studio.png
