app-id: ai.lmstudio.lm-studio
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: lmstudio
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --persist=.lmstudio
  - --talk-name=org.kde.StatusNotifierWatcher
separate-locales: false

modules:
  - name: squishy
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/squishy/cargo
        CARGO_NET_OFFLINE: ture
    build-commands:
      - cargo --offline --frozen build --release
      - install -Dpm755 -t ${FLATPAK_DEST}/bin target/release/squishy
    sources:
      - type: git
        url: https://github.com/pkgforge/squishy.git
        tag: v0.5.2
        commit: be34f0fe914747c2495aa36b1e609e9c18cc961a
      - generated-sources.json
  - name: lmstudio
    buildsystem: simple
    build-commands:
      - install -Dm755 -t ${FLATPAK_DEST}/bin/ apply_extra lmstudio
      - install -Dm644 -t ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps ${FLATPAK_ID}.png
      - install -Dm644 -t ${FLATPAK_DEST}/share/applications ${FLATPAK_ID}.desktop
      - install -Dm644 -t ${FLATPAK_DEST}/share/metainfo ${FLATPAK_ID}.metainfo.xml
    sources:
      - type: script
        commands:
          - exec zypak-wrapper /app/extra/lmstudio/lm-studio "$@"
        dest-filename: lmstudio
      - type: script
        commands:
          - squishy unsquashfs lmstudio.AppImage -w lmstudio >/dev/null
          - rm -f lmstudio.AppImage
        dest-filename: apply_extra
      - type: extra-data
        only-arches: [x86_64]
        filename: lmstudio.AppImage
        url: https://installers.lmstudio.ai/linux/x64/0.4.24-1/LM-Studio-0.4.24-1-x64.AppImage
        sha256: 17cb8ac6374f9182fc127efae20680265e3c4c17d96eadf147eb5fe6111a9353
        size: 1013646674
        x-checker-data:
          type: rotating-url
          url: https://lmstudio.ai/download/latest/linux/x64?format=AppImage
          pattern: https://installers.lmstudio.ai/linux/x64/([0-9.]+)/LM-Studio-([0-9.]+)-x64.AppImage
      - type: extra-data
        only-arches: [aarch64]
        filename: lmstudio.AppImage
        url: https://installers.lmstudio.ai/linux/arm64/0.4.24-1/LM-Studio-0.4.24-1-arm64.AppImage
        sha256: 708908d1510d19ec965514bdf09e6fc688efa076ec166a323c1305535b2939a2
        size: 1288231061
        x-checker-data:
          type: rotating-url
          url: https://lmstudio.ai/download/latest/linux/arm64?format=AppImage
          pattern: https://installers.lmstudio.ai/linux/arm64/([0-9.]+)/LM-Studio-([0-9.]+)-arm64.AppImage
      - type: file
        path: ai.lmstudio.lm-studio.desktop
      - type: file
        path: ai.lmstudio.lm-studio.metainfo.xml
      - type: file
        path: ai.lmstudio.lm-studio.png
